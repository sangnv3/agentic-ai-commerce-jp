# LOCAL DEVELOPMENT ONLY — Redis (sessions, idempotency, budgets) + PostgreSQL/pgvector (audit log, schema).
# Railway uses its own Redis and PostgreSQL services instead.
# Non-default host ports so it does not clash with a Redis/Postgres already running on the machine.
services:
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: food
    ports: ["5433:5432"]
    # Schema: run `npm run db:migrate` in agent-service (same command Railway runs before each deploy).
